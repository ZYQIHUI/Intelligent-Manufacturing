架构分析任务:
  description: >
    分析 {project_path} 项目的系统架构与课程知识库。

    工作清单：
    1) 浏览 src/ 目录下 7 个子目录（frontend、server、agent、tools、sandbox、db、security），
       列出每个子目录的关键文件与对应架构层。
    2) 精读以下文件并记录"职责一句话总结 + 对外暴露接口"：
       - src/server/main.ts（服务入口与路由）
       - src/agent/ 下提示词相关文件（Tutor 提示词构造）
       - src/tools/registry.ts 与 src/tools/policy.ts（工具注册与权限校验）
       - src/sandbox/runner.ts（Docker 安全参数）
       - src/db/schema.sql（数据库表结构）
    3) 浏览 kb/python-course-kb-practical-python/wiki/ 知识库结构，
       选择1个概念（建议"列表"或"字符串"），完整阅读其 .md 文件，
       记录字段（定义/示例/常见错误/相关练习/前置概念）与
       该知识进入导师上下文/练习流程的路径。
    4) 用 Mermaid 语法输出系统结构图（7层 + 数据流方向 + 关键模块名）。
    5) 用 Mermaid 语法输出学习闭环流程图
       （创建会话→诊断→状态→指导→练习→提交→沙箱→评阅→进度更新→回到练习）。

    约束：所有结论必须可溯源到具体源码文件路径；不引入未读取的模块。
  expected_output: >
    一份结构化的架构分析文档（Markdown），包含 5 个章节：
    A) 项目结构表（目录/关键文件/对应架构层/功能简述）
    B) 关键源码"职责一句话 + 对外接口"清单
    C) 1个课程概念的字段分析与知识流转路径
    D) Mermaid 系统结构图（可直接渲染）
    E) Mermaid 学习闭环流程图（标注 API 与模块）
    末尾附"可溯源证据清单"列出所有引用的文件路径。
  agent: 架构分析师
  output_file: output/01-架构分析.md

部署与沙箱测试任务:
  description: >
    规划 {project_path} 的本地化部署与6类沙箱测试方案。

    工作清单：
    1) 部署方案：列出 Node.js 24.x、Docker Desktop、Python 3.11/3.12、
       AI API Key（或本地 Ollama + qwen2.5:7b）的检查命令与安装步骤。
    2) 一键部署脚本大纲：设置 npm 镜像（npmmirror）→ npm install →
       复制 .env.example 为 .env → docker build 沙箱镜像
       （coding-mentor-python-runner:0.1.0）→ npm start → 验证 127.0.0.1:3000。
    3) 6类沙箱测试用例表（每类含：代码示例、预期行为、实际记录字段）：
       ① 正常输出 print('hi') ② 语法错误 def f(
       ③ 运行时错误 1/0 ④ 超时 while True:pass
       ⑤ 越权访问 open('/etc/passwd') ⑥ pytest 评测
    4) 沙箱安全配置记录模板：网络/内存/PID/能力/文件系统/超时/输出截断/用户。
    5) 5 类风险验证用例：提示注入/越权工具调用/不安全代码执行/
       不安全前端渲染/隐藏测试泄露。
    6) 单元测试与学生回路测试命令：npm test / npm run test:student-loop:realistic。

    约束：每个命令都要可一键复制；表格列必须包含"实际stdout/实际stderr/exit code"。
  expected_output: >
    一份可直接执行的部署与测试方案文档（Markdown），包含 6 个章节：
    A) 环境检查命令清单
    B) 一键部署脚本大纲（带中文注释）
    C) 6类沙箱测试用例表（Markdown表格）
    D) 沙箱安全配置记录模板
    E) 5类风险验证用例
    F) 测试命令清单（单元测试/学生回路测试）
    末尾附"截图清单"列出预期要采集的所有界面截图。
  agent: 部署与沙箱测试员
  context:
    - 架构分析任务
  output_file: output/02-部署与沙箱测试方案.md

实验报告撰写任务:
  description: >
    整合架构分析与部署测试材料，撰写 5000-8000 字的实验报告。

    章节结构（严格遵循实验步骤文档第 6.1 节）：
    1) 实验目的（抄录 7 个目的）
    2) 实验环境（Node/npm/Docker/Python/AI Provider/AI Model）
    3) 实验过程
       3.1 部署过程（贴部署测试员截图与命令）
       3.2 架构分析（嵌入系统结构图，说明 7 层协作）
       3.3 学习闭环（嵌入流程图，描述实际操作）
       3.4 沙箱测试（贴 6 张代码截图 + 测试记录表）
       3.5 安全边界（贴架构分析 + 沙箱配置 + 风险验证）
    4) 测试结果（单元测试/学生回路测试摘录）
    5) 问题与思考（8 个问题各 300-500 字，必结合 A 与 B 的实证材料）
    6) 实验心得（500-1000 字）
    7) 附录（结构图/流程图/关键截图清单/日志摘录）

    8 个必答问题（不可遗漏）：
    1) 为什么本系统不能简单理解为"调用大模型 API 的聊天窗口"？
    2) Learning Harness 在系统中具体包含哪些模块？
    3) 课程知识库如何约束模型回答范围？
    4) 工具门禁解决了哪些安全和可靠性问题？
    5) Docker 沙箱为什么是程序设计课程 Agent 的关键模块？
    6) 学习证据和学习状态如何支持连续化指导？
    7) 本实验能够验证系统的哪些能力？
    8) 本实验不能证明哪些能力？
  expected_output: >
    一份完整的实验报告（Markdown，5000-8000 字），严格按 7 章结构，
    每个问题 300+ 字并引用具体证据，截图以 `![描述](相对路径)` 引用，
    表格用 Markdown 表格语法，每章末尾有"小结"。
    末尾输出"八问精炼版"（每问 100 字以内，用于 PPT）。
  agent: 实验报告撰写员
  context:
    - 架构分析任务
    - 部署与沙箱测试任务
  output_file: output/03-实验报告.md

PPT设计任务:
  description: >
    基于架构分析、部署测试方案与实验报告，设计 12-15 页 PPT 大纲。

    推荐结构：
    | 页码 | 标题 | 内容要点 | 素材来源 |
    | 1   | 封面 | 题目/小组/日期 | — |
    | 2   | 目录 | 6大板块 | — |
    | 3   | 实验目的 | 7个目的简化 | 任务文档 |
    | 4   | 实验环境 | Node/Docker/Python/AI | 部署测试员产出 |
    | 5   | 部署过程 | 4-5张截图 | 部署测试员产出 |
    | 6   | 七层架构图 | 系统结构图占满 | 架构分析任务 |
    | 7   | 架构说明 | 每层一句话 | 架构分析任务 |
    | 8   | 知识库样例 | 1个概念分析 | 架构分析任务 |
    | 9   | 学习闭环 | 流程图 + 说明 | 架构分析任务 |
    | 10  | 沙箱测试 | 6张代码截图+表格 | 部署测试员产出 |
    | 11  | 安全机制 | 沙箱配置+工具门禁 | 综合 |
    | 12  | 测试结果 | 单元+学生回路 | 部署测试员产出 |
    | 13  | 八问思考 | 8个问题各1-2句 | 实验报告 |
    | 14  | 实验心得 | 收获+反思+展望 | 实验报告 |
    | 15  | Q&A | 致谢 | — |

    配套产出：
    1) PPT 大纲（Markdown 表格）
    2) 每页的"演讲者备注"（100-200字/页）
    3) 配色与字体规范：主色#2E5BBA、辅色#4CAF50、警示#F44336、字体思源黑体/微软雅黑
    4) "汇报速查表"1页A4核心要点
  expected_output: >
    一份 PPT 设计文档（Markdown），包含：
    A) PPT 大纲表（页码/标题/内容/素材来源）
    B) 每页演讲者备注（100-200字）
    C) 配色字体与版式规范
    D) 汇报速查表（1页A4核心要点）
    末尾标注"待补充的高分辨率截图清单"。
  agent: PPT制作员
  context:
    - 架构分析任务
    - 部署与沙箱测试任务
    - 实验报告撰写任务
  output_file: output/04-PPT设计.md

汇报稿撰写任务:
  description: >
    基于 PPT 大纲与实验报告，撰写 8-12 分钟的中文汇报讲解稿，
    并准备 15+ 个 Q&A。

    讲解稿结构（严格按时间分配）：
    - 开场 30 秒：自我介绍 + 题目复述 + 小组分工简介
    - 实验概述 1 分钟：实验目的简化 + 项目是什么
    - 环境与部署 1 分钟：4个工具版本 + 部署流程一句话 + 1张截图
    - 架构分析 2 分钟：7层架构图 + 每层一句话 + Harness 5个模块
    - 学习闭环 2 分钟：流程图 + 6个阶段 + 1个具体例子
    - 沙箱测试 2 分钟：6类代码 + 表格 + 1-2个亮点（超时/越权）
    - 安全机制 1 分钟：沙箱4项关键配置 + 工具门禁3个作用 + 1个风险验证
    - 八问思考 2 分钟：8问各1句话，重点 Q1/Q5/Q7/Q8
    - 实验心得 1 分钟：3个收获 + 1个困难 + 1个展望
    - 收尾 30 秒：致谢 + 邀请提问

    Q&A 必准备的 15 个问题：
    1) 为什么不是聊天窗口？ 2) Learning Harness 包含哪些模块？
    3) 课程知识库如何约束回答？ 4) 工具门禁解决了什么问题？
    5) Docker 沙箱为什么关键？ 6) 学习证据如何支持连续化？
    7) 实验验证了哪些能力？ 8) 实验没验证哪些能力？
    9) 如果用于真实课堂还需什么？ 10) 沙箱比直接执行的优势？
    11) 提示注入是什么？怎么防？ 12) 提示词如何构造？
    13) 数据库有哪些表？ 14) AI 模型用的什么？ 15) 遇到的最大困难？

    回答技巧：不确定时说"实验中没观察到"；不知道的诚实说"需要回去查"。
  expected_output: >
    一份可直接照读的中文讲解稿（Markdown），包含：
    A) 8-12 分钟讲解稿全文（按时间分段）
    B) 15+ 个 Q&A 准备（问题 + 3-5句回答 + 可能的追问）
    C) 演练建议（3次：镜子/小组成员/全班）
    D) 汇报当天准备清单（U 盘/转接头/激光笔/水）
    E) 紧张应对与互动技巧
  agent: 汇报员
  context:
    - 架构分析任务
    - 部署与沙箱测试任务
    - 实验报告撰写任务
    - PPT设计任务
  output_file: output/05-汇报稿.md
