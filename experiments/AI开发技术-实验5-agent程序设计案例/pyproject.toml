[project]
name = "myflow"
version = "0.1.0"
description = "Python程序设计课程学伴Agent实验协作多智能体系统"
authors = [{ name = "智能创造实验小组", email = "team@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]>=1.14.0",
]

[project.scripts]
kickoff = "myflow.main:kickoff"
run_crew = "myflow.main:kickoff"
plot = "myflow.main:plot"
run_with_trigger = "myflow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myflow"]

[tool.crewai]
type = "flow"
